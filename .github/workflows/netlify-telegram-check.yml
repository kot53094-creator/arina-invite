name: Force Netlify Telegram check

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send direct Telegram test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          echo "Chat ID: $TELEGRAM_CHAT_ID"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H 'Content-Type: application/json' \
            -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"Прямой тест с GitHub Actions ✅\\nЕсли это видишь — бот и Chat ID ок.\\nДальше нужен redeploy Netlify.\"}"
          echo
      - name: Probe Netlify function
        run: |
          echo "GET function:"
          curl -sS "https://fastidious-pasca-a1d784.netlify.app/.netlify/functions/choice" || true
          echo
          echo "POST /api/choice:"
          curl -sS -X POST "https://fastidious-pasca-a1d784.netlify.app/api/choice" \
            -H 'Content-Type: application/json' \
            -d '{"name":"Arina","event":"start"}' || true
          echo
